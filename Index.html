<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VoiceMak</title><style>body{margin:0;background:#0d101a;color:#f4f7ff;font:16px system-ui;display:grid;place-items:center;min-height:100dvh}.panel{width:min(420px,calc(100% - 40px));background:#1a2030;border:1px solid #333d56;border-radius:24px;padding:22px;box-shadow:0 20px 50px #0005}h1{margin:0 0 4px}p{color:#b7c2d6;line-height:1.5}.label{display:flex;justify-content:space-between;margin-top:24px}input[type=range]{width:100%;accent-color:#78aaff;margin:15px 0}button,select{border:0;border-radius:12px;padding:14px;background:#29344c;color:white;font:inherit;width:100%;margin-top:10px}button{background:#6095ff;color:#081020;font-weight:750}button.stop{background:#ff7e8d}#status{font-size:14px;min-height:45px}.hint{font-size:13px}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#8794a9;margin-right:8px}.live{background:#62e6a3}</style></head><body><main class="panel"><h1>🎤 VoiceMak</h1><p>Изменение голоса в реальном времени</p><label for="source">Источник звука</label><select id="source"><option value="">Микрофон по умолчанию</option></select><div class="label"><label for="pitch">Глубина голоса</label><strong id="pitchValue">−3 полутона</strong></div><input id="pitch" type="range" min="-7" max="0" value="-3" step="1"><div class="label"><label for="volume">Громкость</label><span id="volumeValue">20%</span></div><input id="volume" type="range" min="0" max="100" value="20"><button id="toggle">▶ Начать</button><p id="status"><span class="dot"></span>Не запущено</p><p class="hint">⚠️ Держи петличку подальше от динамика, начни с небольшой громкости. Используй HTTPS или localhost. Android может не разрешить нужный маршрут USB → динамик.</p></main><script>
const $=id=>document.getElementById(id);let ctx,stream,src,gain,osc=[],delays=[],running=false;const pitch=$('pitch'),volume=$('volume');function update(){ $('pitchValue').textContent=(+pitch.value===0?'0':'−'+Math.abs(+pitch.value))+' полутона';$('volumeValue').textContent=volume.value+'%';if(gain)gain.gain.setTargetAtTime(+volume.value/500,ctx.currentTime,.03);if(ctx&&osc.length){const ratio=Math.pow(2,+pitch.value/12);const freq=Math.abs(1-ratio)/.055;osc.forEach(o=>o.frequency.setTargetAtTime(Math.max(.01,freq),ctx.currentTime,.03));}}pitch.oninput=update;volume.oninput=update;
async function devices(){try{let list=await navigator.mediaDevices.enumerateDevices();let selected=$('source').value;$('source').innerHTML='<option value="">Микрофон по умолчанию</option>';list.filter(d=>d.kind==='audioinput').forEach(d=>{let o=document.createElement('option');o.value=d.deviceId;o.textContent=d.label||'Микрофон '+($('source').options.length);$('source').append(o)});$('source').value=selected||''}catch(e){}}async function stop(){if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;if(ctx)await ctx.close();ctx=null;gain=null;osc=[];delays=[];running=false;$('toggle').textContent='▶ Начать';$('toggle').className='';$('status').innerHTML='<span class="dot"></span>Остановлено'}
async function start(){try{if(!navigator.mediaDevices?.getUserMedia)throw Error('Нужен HTTPS и поддерживаемый браузер');let id=$('source').value;stream=await navigator.mediaDevices.getUserMedia({audio:{...(id?{deviceId:{ideal:id}}:{}),echoCancellation:false,noiseSuppression:false,autoGainControl:false}});await devices();ctx=new (window.AudioContext||window.webkitAudioContext)({latencyHint:'interactive'});await ctx.resume();src=ctx.createMediaStreamSource(stream);gain=ctx.createGain();gain.gain.value=+volume.value/500;gain.connect(ctx.destination);
// Two modulated delay lines with overlapping crossfades: approximate downward pitch shift.
const ratio=Math.pow(2,+pitch.value/12);if(+pitch.value===0){src.connect(gain)}else{const windowSec=.055;const freq=(1-ratio)/windowSec;for(let i=0;i<2;i++){let delay=ctx.createDelay(.15),wet=ctx.createGain(),lfo=ctx.createOscillator(),depth=ctx.createGain(),fade=ctx.createOscillator(),fadeDepth=ctx.createGain(),bias=ctx.createConstantSource();delay.delayTime.value=.055;depth.gain.value=.023; lfo.type='sawtooth';lfo.frequency.value=Math.max(.01,freq);lfo.connect(depth);depth.connect(delay.delayTime);fade.type='sine';fade.frequency.value=Math.max(.01,freq);fadeDepth.gain.value=.5;fade.connect(fadeDepth);fadeDepth.connect(wet.gain);bias.offset.value=.5;bias.connect(wet.gain);if(i===1){lfo.detune.value=1200;fade.detune.value=1200;}src.connect(delay);delay.connect(wet);wet.connect(gain);lfo.start();fade.start();bias.start();osc.push(lfo,fade);delays.push(delay)}}running=true;$('toggle').textContent='■ Остановить';$('toggle').className='stop';$('status').innerHTML='<span class="dot live"></span>Звук запущен. Если голоса нет, Android мог направить звук в USB.'}catch(e){await stop();$('status').textContent='Ошибка: '+e.message}}
$('toggle').onclick=()=>running?stop():start();devices();
</script></body></html>
